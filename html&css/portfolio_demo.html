<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body{
            margin:0;
            background-color: rgb(0, 0, 12);

        }
        .box1{
            text-align: center;
            width: 100vw;
            font-size: 50px;
            color:white;
            justify-content: center;
            white-space: nowrap;
        }
        .box2{
            margin: 0px;
            width: 40vw;
            height:50vh;
            background-color: rgb(198, 198, 204);
            font-size: x-large;
            text-align: center;
            color: rgb(0, 0, 12);
            border-radius: 30px;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }
        .box3{
            width: 40vw;
            height:50vh;
            overflow: hidden;
        }
        .box3 img{
            width:100%;
            height:100%;
            object-fit: cover;
            border-radius: 50px;
        }
        .container{
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .box4{
            font-size: 30px;
            color:white;
            text-align: center;
            white-space: nowrap;
        }
        .box2 button{
            width: 300px;
            height: 40px;
            font-size: large;
            border-radius: 30px;
            background-color: rgb(0, 0, 12);
            color:white;
            justify-content: center;
            box-sizing: border-box;
        }
        .box2 p{
                white-space: normal;
            }
        .container1{
            width: 100vw;
            display: flex;
            justify-content: space-around;
        }
        .project{
            width: 20vw;
            background-color: rgb(198, 198, 204);
            height: 30vh;
            border-radius: 30px;
        }
        .project img{
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 30px;

            }
        @media (max-width: 850px){
            .box1{
                font-size: 25px;
            }
            .box2{
                margin-top: 5vh;
                width: 90%;
                font-size: 16px;
            }
            .box3{
                margin-top: 5vh;
                width: 90vw;
                height: 40vh;
            }
            .box4{
                font-size: 25px;
            }
            .container{
                flex-direction: column-reverse;
                align-items: center;
                justify-content: center;

            }
            .container1{
                flex-direction: column;
                align-items: center;
                justify-content: center;

            }
            .project{
                width: 90vw;
                height: 40vh;
                margin-top: 5vh;

            }
        }
            

    </style>
</head>
<body>
    <div class="box1">
        <h1>T H E E P A K</h1>
    </div>

    <div class="container">
    <div class="box2">
        <h1>THEEPAK C G</h1>
        <h2>AI Engineer</h2>
        <p>Curious and Ever Learning AI Engineer and FSD </p>
        <button>Explore</button>
    </div>
    <div class="box3">
        <img src="images/portfolio_page1.jpg" alt="Harvey Specter Image">
    </div>
    </div>
    <div class="box4">
        <h2>theepakdemomail@gmail.com</h2>
    </div>
    <div class="container1">
    <div class="project"><img src="images/portfolio_page2.jpg" alt="Image" srcset=""></div>
    <div class="project"><img src="images/portfolio_page3.jpg" alt="Image" srcset=""></div>
    <div class="project"><img src="images/portfolio_page4.jpg" alt="Image" srcset=""></div>
    <div class="project"><img src="images/portfolio_page5.jpg" alt="Image" srcset=""></div>
    </div>
</body>
</html>
