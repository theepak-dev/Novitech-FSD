<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(to left,  #000a1c);
            margin:0;
        }
        h1{
            transition: all 1s ease-in-out;
            color: ghostwhite;
            text-align: center;
            font-size: 80px;
            margin-top: 0px;
        }
        body:hover h1{
            font-size: 150px;
            margin-top: 50px;
        }
        h2{
            text-align: center;
            color: ghostwhite;
            font-size: 50px;
        }
        h6{
            text-align: center;
            color: ghostwhite;
            font-size: 30px;
        }
        img{
            width: 30%;
            height: 300px;
            margin-left: 35%;
            border: 2px silver solid;
            border-radius: 120px;
        }
        .Main{
            display: flex;
            justify-content: space-evenly;
        }
        .Medium{
            transition: all 0.3s ease-in-out;
            background-color: ghostwhite;
            width: 350px;
            border: 2px silver solid;
            border-radius: 20px;
            text-align: center;
        }
         .Medium img{
            width: 350px;
            height: 350px;
            margin-left: 0%;
            border: 0px silver solid;
            border-radius: 100px 20px 150px 0px;
        }
        .Medium button{
            transition: all 0.3s ease-in-out;
            width: 300px;
            height: 60px;
            color: black;
            background-color: ghostwhite;
            border: 0px silver solid;
            font-size: large ;
            font-weight: bolder;
        }
        .Medium:hover{
            background-color: black;
            border:3px silver solid;
            transform: scaleX(1.1);
        }
        .Medium:hover button{
            background-color: black;
            color: ghostwhite;
        }


    </style>
</head>
<body>
