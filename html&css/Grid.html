<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            padding:0;
        }
        .Grid{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 0.3fr 2fr 2fr 0.3fr;
            background-color: dodgerblue;
            height:100vh;
            gap:20px;
            padding:20px
        }
        .Box{
            background-color: brown;
            border-radius: 50px;
            overflow: hidden;

        }
        .Box img{
            width:100%;
            height:100%;
            object-fit: cover;

        }
        .b1{
            grid-column: span 4;
            text-align: center;
            background-color: white;
            font-size: xx-large;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .b5{
            grid-column: span 4;
            text-align: center;
            background-color: white;
            font-size: xx-large;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="Grid">
        <div class="Box b1">E-Commerce</div>
        <div class="Box"><img src="images/Grid1.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid2.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid3.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid4.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid5.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid6.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid7.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid8.jpg" alt="Image"></div>
        <div class="Box b5">Shop at nova</div>
    </div>
</body>
</html>
