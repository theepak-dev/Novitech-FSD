<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            padding:0;
        }
        .Grid{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 0.3fr 2fr 2fr 0.3fr;
            background-color: dodgerblue;
            height:100vh;
            gap:20px;
            padding:20px
        }
        .Box{
            background-color: brown;
            border-radius: 50px;
            overflow: hidden;

        }
        .Box img{
            width:100%;
            height:100%;
            object-fit: cover;

        }
        .b1{
            grid-column: span 4;
            text-align: center;
            background-color: white;
            font-size: xx-large;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .b5{
            grid-column: span 4;
            text-align: center;
            background-color: white;
            font-size: xx-large;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="Grid">
        <div class="Box b1">E-Commerce</div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlMgxHKK1HfSszR4hbD71rfHGq0v4nFkvfdX62IdmOkw&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmiar5RfZjc2ULA4fQ46JU4FodrPMI5VFSp5uiye-Dsg&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfmmUnfQAg4RLgy5cRg_j5kMdCzX79-F_w7hv22Z9icA&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxuQJ-2Z7Bl4_FIIqkyb2xHdyt-g84LMpIcjFfDmQ3FA&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtlavGhtqVfEFSUSD2STmv3tjWFMRYczdfrZXMNbslyw&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTU8qc_QbcfcPFyKSjVUdLmCd5fhtlCOfuRh4qYZ7Zldw&s" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjpUNSGb4c7Xz68c3gerSoMUGZBdaXyi8QEne91XaW7Q&s=10" alt="Image"></div>
        <div class="Box"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeT3eLZJs0jSquPrIXoZhA_xh2CFphZ-tzAL5H6Scouw&s" alt="Image"></div>
        <div class="Box b5">Shop at nova</div>
    </div>
</body>
</html>
