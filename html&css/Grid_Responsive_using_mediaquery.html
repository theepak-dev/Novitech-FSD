<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            padding:0;
            background-color: dodgerblue;
            height:100vh;
            display: flex;
            flex-direction: column;
        }
        .Grid{
            display:grid;
            /* grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); */
            background-color: dodgerblue;
            gap:20px;
            padding:20px;
            align-content: center;
            justify-content: center;
            grid-template-columns: repeat(1, 1fr);
        }
        @media (min-width: 500px){
            .Grid{
                grid-template-columns: repeat(2,1fr);
            }
        }
        @media (min-width: 1100px){
            .Grid{
                grid-template-columns: repeat(4,1fr);
            }
        }
        .Box{
            background-color: brown;
            border-radius: 50px;
            overflow: hidden;
            aspect-ratio: 1/1;

        }
        .Box img{
            width:100%;
            height:100%;
            object-fit: cover;

        }
        .b1{
            text-align: center;
            background-color: white;
            font-size: xx-large;
            align-items: center;
            justify-content: center;

        }
        .b5{
            text-align: center;
            background-color: white;
            font-size: xx-large;
            align-items: center;
            justify-content: center;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="b1">E-Commerce</div>
    <div class="Grid">
        <div class="Box"><img src="images/Grid1.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid2.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid3.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid4.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid5.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid6.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid7.jpg" alt="Image"></div>
        <div class="Box"><img src="images/Grid8.jpg" alt="Image"></div>
    </div>
    <div class="b5">Shop at nova</div>
</body>
</html>
